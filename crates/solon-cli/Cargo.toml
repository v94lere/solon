[package]
name = "solon-cli"
description = "`solon` : Solon en ligne de commande — état du moteur, démarrage et arrêt, réglages, projets, radiographie, sauvegardes, diagnostic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Le binaire s'appelle `solon-cli.exe` dans `target/` : l'application de bureau s'appelle déjà
# `solon.exe` au même endroit. L'installeur le livre sous `bin\solon.exe`, qui est dans le PATH.
[[bin]]
name = "solon-cli"
path = "src/main.rs"

[dependencies]
solon-core = { workspace = true }
solon-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Heures locales dans les sorties (horloge du PC, pas UTC).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console"] }
