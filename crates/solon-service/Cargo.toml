[package]
name = "solon-service"
description = "Service Windows de Solon : possède la machine, expose l'API Docker et le canal de contrôle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "solon-service"
path = "src/main.rs"

[dependencies]
solon-core = { workspace = true }
solon-hvsock = { workspace = true }
solon-vm-hcs = { workspace = true }
solon-prereq = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
tokio = { workspace = true }
uuid = { workspace = true }
windows-service = "0.8"
# Domaines locaux en HTTPS : autorité de certification locale et certificats à la volée.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_Vhd",
    "Win32_Storage_FileSystem",
    "Win32_System_HostComputeNetwork",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
