[workspace]
resolver = "3"
members = [
    "crates/monodon-core",
    "crates/monodon-vm-hcs",
    "crates/monodon-hvsock",
    "crates/monodon-agent",
    "crates/monodon-prereq",
    "crates/monodon-service",
    "crates/monodon-docker-shim",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/v94lere/monodon"
rust-version = "1.85"

[workspace.dependencies]
monodon-core = { path = "crates/monodon-core" }
monodon-hvsock = { path = "crates/monodon-hvsock" }
monodon-vm-hcs = { path = "crates/monodon-vm-hcs" }
monodon-prereq = { path = "crates/monodon-prereq" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "fs", "process", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows = "0.62"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# fuser : voir third_party/fuser/MONODON-NOTES.md (compilation croisée Windows → Linux)
[patch.crates-io]
fuser = { path = "third_party/fuser" }
