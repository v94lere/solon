# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.9.0.schema.json
PackageIdentifier: ValereNeveux.Solon
PackageVersion: 0.2.0
PackageLocale: fr-FR
Publisher: Valère Neveux
PackageName: Solon
License: Apache-2.0
ShortDescription: Docker sur Windows, en silence : les vrais docker et docker compose, sans Docker Desktop ni WSL, une icône dans la barre des tâches et une commande solon.
Description: |-
  Solon est un moteur Docker open source pour Windows. Un installateur fournit dockerd, containerd et Docker Compose
  dans une petite machine Linux que Solon crée et gère lui-même via le service Windows Host Compute, sans Docker
  Desktop ni WSL. Il démarre en quelques secondes, endort les conteneurs inactifs et rend la mémoire, et donne à
  chaque conteneur une adresse HTTPS locale de confiance (https://<nom>.solon.local).
  Pas de fenêtre : une icône dans la barre des tâches montre l'état du moteur et relance un projet en deux clics, et
  la commande solon fait le reste (état, projets, adresses, réglages, sauvegardes, mise à jour), dont la
  Radiographie qui explique en clair pourquoi un service ne répond pas (solon why). Aucune télémétrie.
  Nécessite Windows 10 22H2 ou Windows 11, toute édition, Famille comprise, avec la virtualisation matérielle activée.
Tags:
- conteneurs
- docker
- docker-compose
- hyper-v
- outils-de-developpement
ManifestType: locale
ManifestVersion: 1.9.0
