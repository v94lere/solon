<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="topL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2e2ff"/>
      <stop offset="1" stop-color="#6ab7ff"/>
    </linearGradient>
    <linearGradient id="topR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#97cdff"/>
      <stop offset="1" stop-color="#58afff"/>
    </linearGradient>
    <linearGradient id="leftA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3697f2"/>
      <stop offset="1" stop-color="#1e77c9"/>
    </linearGradient>
    <linearGradient id="leftB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c8de8"/>
      <stop offset="1" stop-color="#1a6cb8"/>
    </linearGradient>
    <linearGradient id="rightA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b72c2"/>
      <stop offset="1" stop-color="#10528f"/>
    </linearGradient>
    <linearGradient id="rightB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2481d8"/>
      <stop offset="1" stop-color="#135fa6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#10528f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- cube isométrique seul, fond transparent : sommet T, gauche L, droite R, centre C, bas B -->
  <g stroke-linejoin="round" filter="url(#shadow)">
    <polygon points="512,96 152,296 512,496" fill="url(#topL)"/>
    <polygon points="512,96 872,296 512,496" fill="url(#topR)"/>
    <polygon points="152,296 512,496 512,896" fill="url(#leftA)"/>
    <polygon points="152,296 152,696 512,896" fill="url(#leftB)"/>
    <polygon points="512,496 872,296 512,896" fill="url(#rightA)"/>
    <polygon points="872,296 872,696 512,896" fill="url(#rightB)"/>
    <polyline points="152,296 512,96 872,296" fill="none" stroke="#e8f4ff" stroke-opacity="0.9" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
