<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="topL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d0ff"/>
      <stop offset="1" stop-color="#5a97ff"/>
    </linearGradient>
    <linearGradient id="topR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb4ff"/>
      <stop offset="1" stop-color="#3f7ff0"/>
    </linearGradient>
    <linearGradient id="leftA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f66e0"/>
      <stop offset="1" stop-color="#1e46b0"/>
    </linearGradient>
    <linearGradient id="leftB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5ad0"/>
      <stop offset="1" stop-color="#173a98"/>
    </linearGradient>
    <linearGradient id="rightA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3f9e"/>
      <stop offset="1" stop-color="#132c74"/>
    </linearGradient>
    <linearGradient id="rightB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#244cb8"/>
      <stop offset="1" stop-color="#173586"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- cube isométrique seul, fond transparent : sommet T, gauche L, droite R, centre C, bas B -->
  <g stroke-linejoin="round" filter="url(#shadow)">
    <polygon points="512,96 152,296 512,496" fill="url(#topL)"/>
    <polygon points="512,96 872,296 512,496" fill="url(#topR)"/>
    <polygon points="152,296 512,496 512,896" fill="url(#leftA)"/>
    <polygon points="152,296 152,696 512,896" fill="url(#leftB)"/>
    <polygon points="512,496 872,296 512,896" fill="url(#rightA)"/>
    <polygon points="872,296 872,696 512,896" fill="url(#rightB)"/>
    <polyline points="152,296 512,96 872,296" fill="none" stroke="#dbeafe" stroke-opacity="0.9" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
