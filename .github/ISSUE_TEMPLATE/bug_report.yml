name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two things make it fast to fix:

        1. **Check the troubleshooting page first**: <https://v94lere.github.io/solon/troubleshooting/>
           (SmartScreen, reboot after enabling Hyper-V, port already in use, container that exits at once,
           network and `solon.local` addresses, disk space).
        2. **Attach the diagnostic zip**: in Solon, **Settings → Diagnostic → Export a diagnostic…**.
           It contains the logs, state, settings, prerequisites report, `docker info` and versions,
           with **no credentials and none of your containers' data**; you can open it and check before
           sending. It answers most of the questions we would otherwise ask you one by one.
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic zip
      description: Drag the zip exported from Settings → Diagnostic here. If you cannot export it (Solon does not open), say so and paste the last lines of `%ProgramData%\Solon\logs\solon-service.log.*` instead.
      placeholder: Drop solon-diagnostic.zip here.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Solon version
      placeholder: "0.1.1 (Settings → Updates shows it), engine image 0.1.0-dev.19"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition and version
      placeholder: "Windows 11 Pro 24H2 (winver)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Error codes shown by Solon (e.g. `ENGINE_UNREACHABLE`) are useful.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: dropdown
    id: env
    attributes:
      label: Environment details
      multiple: true
      options:
        - Corporate VPN active
        - Antivirus / EDR other than Defender
        - Docker Desktop also installed
        - WSL also installed
        - Running inside a virtual machine
        - Non-administrator Windows account
        - Laptop (sleep / hibernate involved)
