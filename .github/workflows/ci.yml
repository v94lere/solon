# Intégration continue : compilation et tests sur Windows à chaque contribution.
# Ne construit pas l'installeur (image du moteur non disponible sur les agents GitHub) ;
# vérifie le service, les crates partagées, l'agent (cible musl) et l'application.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Placeholder bundle resources
        # tauri-build vérifie que chaque fichier de `bundle.resources` existe (service compilé, CLI Docker,
        # image du moteur…) : ils ne sont pas dans le dépôt, on crée des fichiers vides pour la vérification.
        shell: pwsh
        run: |
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          foreach ($rel in $conf.bundle.resources.PSObject.Properties.Name) {
            $path = Join-Path apps/desktop/src-tauri $rel
            if (-not (Test-Path $path)) {
              New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
              New-Item -ItemType File $path | Out-Null
              "placeholder: $path"
            }
          }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check (Windows crates)
        run: cargo check --workspace --all-targets
      - name: Check guest agent (musl)
        run: cargo check -p solon-agent --target x86_64-unknown-linux-musl
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  desktop:
    name: Desktop app (TypeScript)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  installer-scripts:
    name: Installer scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax (setup.ps1 must parse, see CONTRIBUTING)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("installer/setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes("installer/setup.ps1")
          if (-not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) { Write-Error "setup.ps1 must be UTF-8 with BOM"; exit 1 }

  ebpf:
    name: eBPF object matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # L'objet BPF est versionné parce que bpf-linker ne se construit pas sous Windows, d'où la
      # compilation croisée de l'agent ne peut pas le produire. On le reconstruit ici et on exige
      # qu'il soit identique : personne n'a à croire sur parole le binaire du dépôt.
      - name: Rebuild
        run: |
          docker build -t solon-bpf-builder crates/solon-trace-ebpf
          docker run --rm -v "$PWD:/src" solon-bpf-builder
      - name: Unchanged
        run: |
          if ! git diff --quiet -- crates/solon-agent/src/bpf/solon-trace.o; then
            echo "L'objet BPF versionné ne correspond plus à ses sources." >&2
            echo "Relancer crates/solon-trace-ebpf/build.ps1 et commiter le résultat." >&2
            exit 1
          fi
